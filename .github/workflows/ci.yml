name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No version here on purpose: the action reads packageManager from
      # package.json, and specifying both makes it refuse to run.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck (api)
        run: pnpm --filter @karu/api exec tsc --noEmit

      - name: Typecheck (web)
        run: pnpm --filter @karu/web exec tsc --noEmit

      - name: Unit tests
        run: pnpm --filter @karu/api exec vitest run

      - name: Build api
        run: pnpm --filter @karu/api run build

      - name: Build web
        run: pnpm --filter @karu/web run build
        env:
          VITE_API_URL: https://api.getkaru.io
          VITE_SUPABASE_URL: https://oxjkrfcwffdkycrstnxz.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-placeholder
